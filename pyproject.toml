[project]
name = "momu-agent-framework"
version = "0.1.0"
description = "参考 HelloAgents 实现的智能体框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "openai>=2.31.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
search = [
    "serpapi>=1.0.2",
    "tavily-python>=0.7.23",
]
memory = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.8",
    "kuzu>=0.11.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8.14",
]
rag = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.8",
    "markitdown>=0.1.5",
    "sentence-transformers>=5.4.1",
]
mcp = [
    "mcp>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["momu_agent*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
