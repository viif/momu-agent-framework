[project]
name = "momu-agent"
version = "0.1.0"
description = "基于HelloAgents框架构建的智能体框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["momu_agent*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"