name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --only-group dev

      - name: Lint with Ruff (Check)
        run: uv run ruff check --output-format=github .

      - name: Format with Ruff (Check)
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set cache directory env
        run: |
          echo "SENTENCE_TRANSFORMERS_HOME=$(pwd)/.model_cache" >> $GITHUB_ENV

      - name: Cache Sentence Transformers
        uses: actions/cache@v4
        with:
          path: .model_cache
          key: ${{ runner.os }}-sentence-transformers-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and local package
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu --no-deps
          uv sync --frozen --all-extras

      - name: Run tests with pytest
        run: |
          uv run pytest